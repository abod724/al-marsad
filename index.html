<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صحيفة المرصد | البث الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ✅ منع السحب نهائيًا */
        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
        }

        body {
            background-color: #fafaf9;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(197, 155, 39, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(197, 155, 39, 0.05) 0%, transparent 40%);
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            max-height: 100vh;
            background: #ffffff;
            border-radius: 26px;
            padding: 1.3rem 1.3rem;
            box-shadow: 
                0 1px 2px rgba(0,0,0,0.02),
                0 8px 24px -8px rgba(197, 155, 39, 0.15),
                0 30px 60px -20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(197, 155, 39, 0.12);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.5rem;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* الشعار */
        header { flex-shrink: 0; }

        .logo-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 0.3rem;
            animation: slowRotate 25s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .logo-ar {
            font-size: 2.1rem;
            font-weight: 900;
            color: #C59B27;
            line-height: 1;
            letter-spacing: -1px;
            text-shadow: 0 4px 20px rgba(197, 155, 39, 0.15);
        }

        .logo-en {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #C59B27;
            opacity: 0.7;
            margin-top: 0.25rem;
            padding-right: 5px;
        }

        .tagline {
            font-size: 0.8rem;
            color: #78716c;
            font-weight: 500;
            margin-top: 0.3rem;
        }

        /* الشخصية */
        .stage {
            display: flex;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(197, 155, 39, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            z-index: 0;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
        }

        #avatar {
            width: 170px;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        #avatar.talking {
            animation: bob 0.8s infinite alternate ease-in-out;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to   { transform: translateY(-8px); }
        }

        /* مربع البث */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border-radius: 14px;
            border: 2px solid #f1f5f9;
            resize: none;
            font-size: 0.9rem;
            font-family: inherit;
            background-color: #fafaf9;
            color: #1a1a1a;
            transition: all 0.3s ease;
            line-height: 1.5;
            text-align: right;
        }

        textarea:focus {
            outline: none;
            border-color: #C59B27;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.12);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #C59B27 0%, #D4AF37 50%, #C59B27 100%);
            background-size: 200% auto;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 
                0 10px 20px -5px rgba(197, 155, 39, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button:hover:not(:disabled) {
            background-position: right center;
            transform: translateY(-2px);
        }

        button:active:not(:disabled) { transform: translateY(0); }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #d6d3d1;
            box-shadow: none;
        }

        footer {
            font-size: 0.65rem;
            color: #a8a29e;
            flex-shrink: 0;
        }

        /* ✅ شاشات قصيرة (جوالات قديمة أو عرض أفقي) */
        @media (max-height: 700px) {
            .logo-ar   { font-size: 1.8rem; }
            .logo-icon { width: 35px; height: 35px; }
            #avatar    { width: 140px; }
            .tagline   { font-size: 0.75rem; }
            .container { padding: 1rem 1.1rem; }
        }

        @media (max-height: 600px) {
            .logo-ar   { font-size: 1.5rem; }
            .logo-icon { width: 30px; height: 30px; }
            #avatar    { width: 110px; }
            .logo-en   { display: none; }
            textarea   { font-size: 0.8rem; padding: 0.6rem; }
            button     { padding: 0.7rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <div class="logo-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="none" stroke="#C59B27" stroke-width="3"/>
                    <circle cx="30" cy="30" r="18" fill="none" stroke="#C59B27" stroke-width="2"/>
                    <circle cx="30" cy="30" r="6" fill="#C59B27"/>
                </svg>
            </div>
            <h1 class="logo-ar">المرصد</h1>
            <p class="logo-en">A L M A R S D</p>
            <p class="tagline">منصة البرودسكات الذكية</p>
        </header>

        <div class="stage">
            <div class="glow"></div>
            <svg id="avatar" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <circle cx="200" cy="250" r="190" fill="#fefce8"/>
                <ellipse cx="200" cy="470" rx="120" ry="20" fill="#f1f5f9"/>

                <path d="M80 500 L80 350 C80 290, 320 290, 320 350 L320 500 Z" fill="#1e293b"/>
                <path d="M160 350 L200 450 L240 350 Z" fill="#ffffff"/>
                <path d="M190 370 L200 400 L210 370 L200 350 Z" fill="#C59B27"/>

                <circle cx="200" cy="200" r="95" fill="#ffedd5"/>
                <path d="M105 180 C105 90, 295 90, 295 180 C295 140, 250 100, 200 100 C150 100, 105 140, 105 180 Z" fill="#334155"/>

                <rect x="125" y="165" width="55" height="35" rx="8" fill="none" stroke="#1e293b" stroke-width="5"/>
                <rect x="220" y="165" width="55" height="35" rx="8" fill="none" stroke="#1e293b" stroke-width="5"/>
                <line x1="180" y1="185" x2="220" y2="185" stroke="#1e293b" stroke-width="5"/>

                <circle cx="152" cy="182" r="7" fill="#1e293b"/>
                <circle cx="247" cy="182" r="7" fill="#1e293b"/>
                <circle cx="154" cy="180" r="2" fill="#fff"/>
                <circle cx="249" cy="180" r="2" fill="#fff"/>

                <path d="M130 155 Q152 145 175 155" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
                <path d="M225 155 Q247 145 270 155" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

                <path d="M200 190 L200 215 L210 220" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

                <ellipse id="mouth" cx="200" cy="235" rx="25" ry="5" fill="#dc2626"/>

                <circle cx="120" cy="215" r="12" fill="#fca5a5" opacity="0.4"/>
                <circle cx="280" cy="215" r="12" fill="#fca5a5" opacity="0.4"/>

                <rect x="300" y="400" width="15" height="80" rx="7" fill="#94a3b8"/>
                <ellipse cx="307" cy="400" rx="25" ry="12" fill="#cbd5e1"/>
            </svg>
        </div>

        <div class="controls">
            <textarea id="script" rows="2" placeholder="اكتب النص هنا...">مرحباً بكم في صحيفة المرصد! نحن هنا لنقدم لكم أحدث الأخبار والمعلومات.</textarea>
            <button id="speakBtn">
                <span class="btn-text">🎤 ابدأ البث</span>
            </button>
        </div>

        <footer>
            <p>© 2026 صحيفة المرصد</p>
        </footer>

    </div>

    <script>
        const speakBtn  = document.getElementById('speakBtn');
        const scriptBox = document.getElementById('script');
        const mouth     = document.getElementById('mouth');
        const avatar    = document.getElementById('avatar');

        let isTalking = false;
        let mouthInterval = null;

        function startMouthAnimation() {
            isTalking = true;
            avatar.classList.add('talking');
            mouthInterval = setInterval(() => {
                const ry = 5 + Math.random() * 20;
                const rx = 20 + Math.random() * 15;
                mouth.setAttribute('ry', ry.toFixed(1));
                mouth.setAttribute('rx', rx.toFixed(1));
            }, 100);
        }

        function stopMouthAnimation() {
            isTalking = false;
            avatar.classList.remove('talking');
            clearInterval(mouthInterval);
            mouth.setAttribute('rx', 25);
            mouth.setAttribute('ry', 5);
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم النطق. جرّب Chrome أو Edge.');
                return;
            }
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1;
            utterance.pitch = 1.1;

            const voices = window.speechSynthesis.getVoices();
            const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
            if (arabicVoice) utterance.voice = arabicVoice;

            utterance.onstart = startMouthAnimation;
            utterance.onend   = stopMouthAnimation;
            utterance.onerror = stopMouthAnimation;

            window.speechSynthesis.speak(utterance);
        }

        speakBtn.addEventListener('click', () => {
            const text = scriptBox.value.trim();
            if (!text) return alert('اكتب نصًا أولاً');

            if (isTalking) {
                window.speechSynthesis.cancel();
                stopMouthAnimation();
                speakBtn.querySelector('.btn-text').textContent = '🎤 ابدأ البث';
            } else {
                speakBtn.querySelector('.btn-text').textContent = '⏹ إيقاف البث';
                speak(text);
            }
        });

        setInterval(() => {
            if (!window.speechSynthesis.speaking && isTalking) {
                stopMouthAnimation();
                speakBtn.querySelector('.btn-text').textContent = '🎤 ابدأ البث';
            }
        }, 500);
    </script>

</body>
</html>
